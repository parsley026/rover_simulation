local_topography_node:
  ros__parameters:
    use_sim_time: true
    resolution: 0.1
    mapping_mode: "local"
    filter_chain_parameter_name: "filters"
    map_frame: odom
    robot_frame: base_link
    pointcloud_topic: /lidar_00/points
    costmap_topic: /local_topography_costmap
    gridmap_topic: /topography/local_grid_map

global_topography_node:
  ros__parameters:
    use_sim_time: true
    resolution: 0.1
    mapping_mode: "global"
    filter_chain_parameter_name: "filters"
    map_frame: map
    robot_frame: base_link
    pointcloud_topic: /mapping/cloud_map
    costmap_topic: /global_topography_costmap
    gridmap_topic: /topography/global_grid_map
