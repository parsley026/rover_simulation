ukf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base-link
    world_frame: odom

    publish_tf: true

    # ----------------------------------------------------------------
    # ODOMETRY CONFIGURATION
    # ----------------------------------------------------------------

    # Camera 00 (Fusing Absolute Orientation)
    odom2: /camera_00/odom
    odom2_config: [false, false, false,
                   true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom2_queue_size: 10
    odom2_differential: false

    # Camera 01 (Fusing 3D Velocities)
    odom1: /camera_01/odom
    odom1_config: [false, false, false,
                   false, false, false,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false

    # Lidar 00 (Primary Absolute Pose & Velocity)
    odom0: /lidar_00/odom
    odom0_config: [true,  true,  true,
                   false, false, false,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false

    # ----------------------------------------------------------------
    # IMU CONFIGURATION
    # ----------------------------------------------------------------
    
    imu0: /camera_00/camera_00/imu/data
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: true
    imu0_remove_gravitational_acceleration: true

    imu1: /camera_01/camera_01/imu/data
    imu1_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu1_queue_size: 10
    imu1_differential: true
    imu1_remove_gravitational_acceleration: true

    imu2: /lidar_00/imu
    imu2_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu2_queue_size: 10
    imu2_differential: true
    imu2_remove_gravitational_acceleration: true