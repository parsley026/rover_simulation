# Bridge template: Luxonis OAK-D Pro W (simulation mode)
#
# Token substitution applied at runtime by dynamic_bridge_node:
#   {ID}          → sensor id from payload.yaml  (e.g. camera_01)
#   {ROBOT_NAME}  → Gazebo entity name           (e.g. rover)
#   {WORLD_NAME}  → Gazebo world name            (e.g. mars_yard)

# ── RGB ───────────────────────────────────────────────────────────────────
- ros_topic_name: "/{ID}/rgb/image_raw"
  gz_topic_name:  "/{ID}_rgbd_sensor/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/{ID}/rgb/camera_info"
  gz_topic_name:  "/{ID}_rgbd_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

