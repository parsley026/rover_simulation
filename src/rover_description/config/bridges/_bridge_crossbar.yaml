# ==============================================================================
# Bridges for Standalone Crossbar Submodule Gazebo Simulation
# ==============================================================================

# ── Crossbar Camera (Stereolabs ZED2i) ─────────────────────────────────────────
- ros_topic_name: "/camera_02/left/image_raw"
  gz_topic_name:  "/camera_02_left_sensor/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/left/camera_info"
  gz_topic_name:  "/camera_02_left_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/right/image_raw"
  gz_topic_name:  "/camera_02_right_sensor/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/right/camera_info"
  gz_topic_name:  "/camera_02_right_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/depth/image_raw"
  gz_topic_name:  "/camera_02_depth_sensor/depth_image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/depth/camera_info"
  gz_topic_name:  "/camera_02_depth_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/depth/points"
  gz_topic_name:  "/camera_02_depth_sensor/points"
  ros_type_name:  "sensor_msgs/msg/PointCloud2"
  gz_type_name:   "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_02/imu/data_raw"
  gz_topic_name:  "/camera_02_imu_sensor"
  ros_type_name:  "sensor_msgs/msg/Imu"
  gz_type_name:   "gz.msgs.IMU"
  direction: GZ_TO_ROS
