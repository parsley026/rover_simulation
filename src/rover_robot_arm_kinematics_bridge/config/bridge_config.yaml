rover_robot_arm_kinematics_bridge_node:
  ros__parameters:

    publish_rate: 20.0
    hardware_timeout_sec: 0.5

    mode: "simulation"
    use_sim_time: true

    pole_numbers: 7
    gear_ratio_arm: 1000.0
    gear_ratio_gripper: 1000.0
    gripper_linear_scale: 0.0001

    # Joint inversion flags (Gazebo vs real hardware)
    invert_link1: false
    invert_link2: false
    invert_link3: false
    invert_link4: false
    invert_link5: false
    invert_link6: false
    invert_gripper: false

    # Per-joint gear ratios (defaults to 1000:1)
    gear_ratio_link1: 1000.0
    gear_ratio_link2: 1000.0
    gear_ratio_link3: 1000.0
    gear_ratio_link4: 1000.0
    gear_ratio_link5: 1000.0
    gear_ratio_link6: 1000.0
