# Chassis Joint States (model-agnostic, chassis-only, Bug 4 fix)
# Bridges the explicit Gazebo topic set in core_plugins.xacro -> ROS 2 topic.
# /chassis/joint_states is consumed by:
#   - simulation_mode.cpp (direct, high-rate feedback)
#   - joint_state_publisher merger (source_list entry)
- ros_topic_name: "/chassis/joint_states"
  gz_topic_name: "/chassis/gz_joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS


