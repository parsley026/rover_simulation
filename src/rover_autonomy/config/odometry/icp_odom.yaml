/**:
  ros__parameters:
    frame_id: base_link
    odom_frame_id: odom
    publish_tf: false

    qos: 1
    qos_scan: 2                   # <-- CRITICAL: Match Ouster's Best Effort QoS
    use_sim_time: false
    
    subscribe_scan: false         
    subscribe_scan_cloud: true    
    
    approx_sync: true
    publish_null_when_lost: false
    wait_imu_to_init: false
    queue_size_odom: 200
    wait_for_transform: 0.5       # <-- Gives TF tree time to provide base_link -> lidar

    Odom/ResetCountdown: "1"
    
    Icp/PointToPlane: "false" 
    Icp/PointToPlaneK: "0"
    Icp/VoxelSize: "0.05"
    Icp/MaxCorrespondenceDistance: "0.3"
    Icp/Iterations: "20"
    
    # Odom/Strategy: "0"
    # ground_normals_up: true