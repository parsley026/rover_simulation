# ArUco Landmark Database
# ========================
# Maps ArUco marker ID → known pose in the MAP frame.
#
# Competition spec:
#   Dictionary : DICT_5X5_100  (aruco_ros default: DICT_5X5_250 — set to 100)
#   Marker IDs : 51 – 64
#   Marker size : 0.150 m  (150 mm, printed on A4)
#   Visible from: all 4 sides of the marker stand
#
# Coordinate convention:
#   x, y, z  — marker centre in metres, map frame (ENU: x=East, y=North)
#   roll/pitch — usually 0.0 for wall-mounted / upright markers
#   yaw        — direction the marker FACE points INTO the scene (radians)
#                i.e., a rover facing the marker is looking in the
#                opposite direction (yaw + π from the marker's yaw)
#
# Fill in real values from your competition site survey or pre-run
# calibration. The node logs a WARNING for any detected ID not listed here.
# ============================================================

marker_size_m: 0.150
aruco_dictionary: "DICT_5X5_100"

landmarks:
  # ----------------------------------------------------------
  # Gate / Waypoint Markers — IDs 51–64
  # All values are 0.0 PLACEHOLDERS: replace with survey data.
  # ----------------------------------------------------------

