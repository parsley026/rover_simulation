/**:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    
    two_d_mode: false               # CHANGED: Unlocks Z, Roll, and Pitch
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link      # FIXED: Underscore, not hyphen
    world_frame: odom

    # 1. KINEMATIC ODOMETRY (Wheels)
    odom0: /kinematics/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false, # Fusing vx, vy
                   false, false, true,  # Fusing yaw velocity
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # 2. CAMERA ODOMETRY (3D Spatial)
    odom1: /camera_00/odom
    odom1_config: [true,  true,  true,  # CHANGED: Fusing absolute X, Y, Z
                   true,  true,  true,  # CHANGED: Fusing absolute Roll, Pitch, Yaw
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: false       
    odom1_relative: true            

    # 3. LIDAR ODOMETRY (3D Spatial)
    odom2: /lidar_00/odom           
    odom2_config: [true,  true,  true,  # CHANGED: Fusing absolute X, Y, Z
                   true,  true,  true,  # CHANGED: Fusing absolute Roll, Pitch, Yaw
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom2_queue_size: 10
    odom2_differential: false
    odom2_relative: true            

    # # 4. IMU (Crucial for 3D orientation and gravity)
    # imu0: /imu/data
    # imu0_config: [false, false, false,
    #               true,  true,  true,   # CHANGED: Fusing absolute Roll, Pitch, Yaw
    #               false, false, false,
    #               true,  true,  true,   # CHANGED: Fusing Roll, Pitch, Yaw velocities
    #               true,  true,  true]   # CHANGED: Fusing X, Y, Z linear acceleration
    # imu0_queue_size: 10
    # imu0_differential: false
    # imu0_relative: false
    # imu0_remove_gravitational_acceleration: true # MANDATORY when fusing Z acceleration