# NVIDIA GPU override for the shadow container.
#
# Without this, Gazebo and RViz render on the CPU (Mesa llvmpipe), which is
# what makes the simulation slow even on a good GPU.
#
# One-time host setup (Linux):
#   1. NVIDIA driver installed and working on the host (`nvidia-smi`).
#   2. NVIDIA Container Toolkit:
#        https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#      then: sudo nvidia-ctk runtime configure --runtime=docker
#            sudo systemctl restart docker
#
# Use it on top of the base file:
#   docker compose -f docker/compose.yaml -f docker/compose.nvidia.yaml run --rm shadow
#
# Check inside the container:
#   nvidia-smi                          -> lists the GPU
#   glxinfo -B | grep -i "renderer"     -> must say NVIDIA, not llvmpipe

services:
  shadow:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      # "graphics" is what exposes OpenGL/EGL to the container; the default
      # (compute,utility) gives CUDA only, and Gazebo would still use the CPU.
      NVIDIA_DRIVER_CAPABILITIES: all
      # Hybrid-graphics laptops: render on the NVIDIA GPU, not the integrated one.
      __NV_PRIME_RENDER_OFFLOAD: "1"
      __GLX_VENDOR_LIBRARY_NAME: nvidia
