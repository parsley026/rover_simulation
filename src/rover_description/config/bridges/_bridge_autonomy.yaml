# ==============================================================================
# Bridges for Standalone Autonomy Submodule Gazebo Simulation
# ==============================================================================

# ── LiDAR (Ouster OS1) ────────────────────────────────────────────────────────
- ros_topic_name: "/lidar_00/points"
  gz_topic_name:  "/lidar_00"
  ros_type_name:  "sensor_msgs/msg/PointCloud2"
  gz_type_name:   "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/lidar_00/imu/data"
  gz_topic_name:  "/lidar_00/imu"
  ros_type_name:  "sensor_msgs/msg/Imu"
  gz_type_name:   "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ── Lower Camera (Stereolabs ZED2i) ───────────────────────────────────────────
- ros_topic_name: "/camera_01/left/image_raw"
  gz_topic_name:  "/camera_01_left_sensor/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/left/camera_info"
  gz_topic_name:  "/camera_01_left_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/right/image_raw"
  gz_topic_name:  "/camera_01_right_sensor/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/right/camera_info"
  gz_topic_name:  "/camera_01_right_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/depth/image_raw"
  gz_topic_name:  "/camera_01_depth_sensor/depth_image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/depth/camera_info"
  gz_topic_name:  "/camera_01_depth_sensor/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/depth/points"
  gz_topic_name:  "/camera_01_depth_sensor/points"
  ros_type_name:  "sensor_msgs/msg/PointCloud2"
  gz_type_name:   "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  qos_profile: 'SENSOR_DATA'

- ros_topic_name: "/camera_01/imu/data_raw"
  gz_topic_name:  "/camera_01_imu_sensor"
  ros_type_name:  "sensor_msgs/msg/Imu"
  gz_type_name:   "gz.msgs.IMU"
  direction: GZ_TO_ROS
